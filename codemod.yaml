schema_version: "1.0"

name: "bytestrone-ef-migration-assessment-bundle"
version: "1.0.11"
description: "Dynamic AST analyzer & consolidated single-step Codemod Insights metrics emitter for EF migration readiness."
author: "bijo abraham"
license: "MIT"

targets:
  languages:
    - "csharp"
    - "javascript"
    - "html"
    - "xml"

keywords: ["transformation", "migration", "assessment"]

registry:
  access: "private"
  visibility: "private"

capabilities:
  - "fs"

workflows:
  - name: main
    default: true
    path: workflow.yaml
