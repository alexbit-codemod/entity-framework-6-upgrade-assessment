# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: ef-objectcontext-usages
    name: Count ObjectContext usages
    type: automatic
    steps:
      - name: "Emit ef_objectcontext_usages metric"
        js-ast-grep:
          js_file: scripts/ef-objectcontext-usages.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
          exclude:
            - "**/node_modules/**"
            - "**/dist/**"
            - "**/build/**"
            - "**/bin/**"
            - "**/obj/**"

  - id: ef-idbset-usages
