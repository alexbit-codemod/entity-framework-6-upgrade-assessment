# yaml-language-server: $schema=https://raw.githubusercontent.com/codemod/codemod/refs/heads/main/schemas/workflow.json

version: "1"

nodes:
  - id: analyze-dbcontext-and-orm-patterns
    name: "Comprehensive EF Migration & ORM Pattern Analysis"
    type: automatic
    steps:
      - name: "Scan solution files for EF versions, DbContext, mappings, API risks, and effort metrics"
        js-ast-grep:
          js_file: scripts/assess-code.ts
          base_path: "."
          language: "csharp"
          include:
            - "**/*.cs"
            - "**/*.csproj"
            - "**/*.config"
          exclude:
            - "**/node_modules/**"
            - "**/bin/**"
            - "**/obj/**"
